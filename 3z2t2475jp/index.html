		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":91399220,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

<script id="pv-skript">
(function () {
  'use strict';
  var AUSRICHTUNG = 'any';
  var d = document;
  var el = d.documentElement;
  var alsApp = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches
    || window.matchMedia('(display-mode: fullscreen)').matches;
  var finger = window.matchMedia('(pointer: coarse)').matches;
  // Vom Home-Bildschirm gestartet läuft das Spiel schon ohne Leisten; am Rechner stört der Hinweis nur.
  if (alsApp || !finger) return;

  var anfordern = el.requestFullscreen || el.webkitRequestFullscreen;
  function istVoll() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
  function drehen() {
    try {
      if (AUSRICHTUNG !== 'any' && screen.orientation && screen.orientation.lock) {
        var p = screen.orientation.lock(AUSRICHTUNG);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) { /* nicht jedes Gerät erlaubt das Feststellen */ }
  }
  function vollbild() {
    try {
      var p = anfordern.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(drehen).catch(function () {});
      else drehen();
    } catch (e) { /* abgelehnt: das Spiel läuft im Fenster weiter */ }
  }
  function knopf(klasse, text, aktion) {
    var b = d.createElement('button');
    b.type = 'button';
    b.className = klasse;
    b.textContent = text;
    b.addEventListener('click', function (e) { e.stopPropagation(); aktion(); });
    return b;
  }
  function absatz(klasse, text) {
    var p = d.createElement('p');
    p.className = klasse;
    p.textContent = text;
    return p;
  }

  var chip = null;
  function chipZeigen(an) {
    if (!anfordern) return;
    if (!chip) {
      chip = d.createElement('button');
      chip.type = 'button';
      chip.id = 'pv-chip';
      chip.textContent = 'Vollbild';
      chip.addEventListener('click', function (e) { e.stopPropagation(); vollbild(); });
      d.body.appendChild(chip);
    }
    chip.style.display = an ? 'block' : 'none';
  }

  function start() {
    var huelle = d.createElement('div');
    huelle.id = 'pv-start';
    ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'mouseup', 'click'].forEach(function (n) {
      huelle.addEventListener(n, function (e) { e.stopPropagation(); });
    });
    var karte = d.createElement('div');
    karte.className = 'pv-karte';
    function zu() { if (huelle.parentNode) huelle.parentNode.removeChild(huelle); }

    if (anfordern) {
      karte.appendChild(absatz('pv-titel', 'Vollbild'));
      karte.appendChild(absatz('pv-text', 'Im Vollbild verschwinden die Leisten des Browsers, und das Spiel nutzt den ganzen Bildschirm.'));
      karte.appendChild(knopf('pv-ja', 'Im Vollbild spielen', function () { vollbild(); zu(); }));
      karte.appendChild(knopf('pv-nein', 'Ohne Vollbild weiter', zu));
      var warVoll = false;
      var wechsel = function () {
        if (istVoll()) { warVoll = true; chipZeigen(false); }
        else if (warVoll) chipZeigen(true);   // Vollbild verlassen: kleiner Knopf zum Zurückkehren
      };
      d.addEventListener('fullscreenchange', wechsel);
      d.addEventListener('webkitfullscreenchange', wechsel);
    } else {
      // iPhone: Safari kennt Vollbild nur für Seiten, die vom Home-Bildschirm gestartet werden.
      karte.appendChild(absatz('pv-titel', 'Vollbild auf dem iPhone'));
      karte.appendChild(absatz('pv-text', 'Safari zeigt ein Spiel nur dann im Vollbild, wenn es vom Home-Bildschirm gestartet wird:'));
      var liste = d.createElement('ol');
      ['Im Browser auf „Teilen“ tippen', '„Zum Home-Bildschirm“ wählen', 'Das Spiel über das neue Symbol starten'].forEach(function (t) {
        var li = d.createElement('li');
        li.textContent = t;
        liste.appendChild(li);
      });
      karte.appendChild(liste);
      karte.appendChild(absatz('pv-klein', 'Der Spielstand beginnt dort neu.'));
      karte.appendChild(knopf('pv-nein', 'Hier im Fenster weiterspielen', zu));
    }
    huelle.appendChild(karte);
    d.body.appendChild(huelle);
  }

  if (d.body) start();
  else d.addEventListener('DOMContentLoaded', start);
})();
</script>
